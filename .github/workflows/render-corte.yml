name: Render Corte IA

# Worker do "corte com IA": pega a gravação do teleprompter (até 60 s),
# transcreve (faster-whisper), planeja com o Claude (palavras-chave, b-roll,
# correções) e renderiza o reel 9:16 com ffmpeg + libass. Disparado pela
# plataforma via workflow_dispatch (apps/franquias/src/lib/corte/actions.ts).
#
# Credenciais vêm como INPUTS (mesmo padrão do render-reel.yml), com fallback
# pros secrets do repo: SUPABASE_URL, SUPABASE_SERVICE_ROLE, ANTHROPIC_API_KEY.

on:
  workflow_dispatch:
    inputs:
      corte_id:
        description: "id na tabela cortes_ia"
        required: true
      broll_franqueada_id:
        description: "franqueada dona da biblioteca de b-roll compartilhada (coringas)"
        required: false
        default: ""
      supabase_url:
        required: false
        default: ""
      supabase_key:
        required: false
        default: ""
      anthropic_key:
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SB_URL: ${{ inputs.supabase_url != '' && inputs.supabase_url || secrets.SUPABASE_URL }}
      SB_KEY: ${{ inputs.supabase_key != '' && inputs.supabase_key || secrets.SUPABASE_SERVICE_ROLE }}
      ANTHROPIC_API_KEY: ${{ inputs.anthropic_key != '' && inputs.anthropic_key || secrets.ANTHROPIC_API_KEY }}
      WHISPER_MODEL: small
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-ct2-v1

      - name: Instalar dependências
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q faster-whisper anthropic fonttools requests

      - name: Processar corte
        run: |
          python3 packages/corte-ia/pipeline.py \
            --corte-id "${{ inputs.corte_id }}" \
            --broll-franqueada-id "${{ inputs.broll_franqueada_id }}"

      - name: Marcar erro (rede de segurança)
        if: failure()
        run: |
          curl -s -X PATCH "$SB_URL/rest/v1/cortes_ia?id=eq.${{ inputs.corte_id }}&status=neq.pronto" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"erro","erro_msg":"worker falhou antes de terminar"}' || true
