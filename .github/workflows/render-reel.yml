name: Render Reel Animado

# Worker de vídeo: renderiza um reel MP4 (Python/PIL + ffmpeg) e sobe pro
# Supabase Storage. Disparado pela plataforma via API do GitHub
# (workflow_dispatch). As credenciais do Supabase vêm como INPUTS (enviadas
# pelo app, que já as tem na Vercel) — com fallback para secrets do repo.

on:
  workflow_dispatch:
    inputs:
      spec_b64:
        description: "SPEC do reel em JSON, codificado em base64"
        required: true
      destino_path:
        description: "Caminho no bucket franqueadas-assets"
        required: true
      handle:
        required: false
        default: "@nutri_secrets"
      anuncio:
        required: false
        default: "false"
      reel_id:
        description: "id na tabela reels_animados (pra marcar pronto/erro)"
        required: false
        default: ""
      post_id:
        description: "post do pacote de domingo que recebe o vídeo (vazio no botão manual)"
        required: false
        default: ""
      aline_post_id:
        description: "post do Studio (aline.posts) que recebe o vídeo (vazio fora do Studio)"
        required: false
        default: ""
      supabase_url:
        required: false
        default: ""
      supabase_key:
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SB_URL: ${{ inputs.supabase_url != '' && inputs.supabase_url || secrets.SUPABASE_URL }}
      SB_KEY: ${{ inputs.supabase_key != '' && inputs.supabase_key || secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install pillow numpy

      - name: Renderizar
        run: |
          echo "${{ inputs.spec_b64 }}" | base64 -d > /tmp/spec.json
          EXTRA=""
          if [ "${{ inputs.anuncio }}" = "true" ]; then EXTRA="--anuncio"; fi
          python3 packages/reel-engine/engine/render_cli.py /tmp/spec.json /tmp/reel.mp4 \
            --handle "${{ inputs.handle }}" $EXTRA

      - name: Upload pro Supabase Storage
        run: |
          curl -sf -X POST \
            "$SB_URL/storage/v1/object/franqueadas-assets/${{ inputs.destino_path }}" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @/tmp/reel.mp4
          echo "enviado: ${{ inputs.destino_path }}"

      - name: Marcar como pronto
        if: inputs.reel_id != ''
        run: |
          SIGNED=$(curl -sf -X POST "$SB_URL/storage/v1/object/sign/franqueadas-assets/${{ inputs.destino_path }}" \
            -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" \
            -d '{"expiresIn":31536000}' | python3 -c "import json,sys;print(json.load(sys.stdin)['signedURL'])")
          curl -sf -X PATCH "$SB_URL/rest/v1/reels_animados?id=eq.${{ inputs.reel_id }}" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"pronto\",\"path\":\"${{ inputs.destino_path }}\",\"url\":\"$SB_URL/storage/v1$SIGNED\"}"
          if [ -n "${{ inputs.post_id }}" ]; then
            curl -sf -X PATCH "$SB_URL/rest/v1/posts_agendados?id=eq.${{ inputs.post_id }}" \
              -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"url_video_final\":\"$SB_URL/storage/v1$SIGNED\"}"
          fi

      - name: Ligar ao post do Studio
        if: inputs.aline_post_id != ''
        run: |
          SIGNED=$(curl -sf -X POST "$SB_URL/storage/v1/object/sign/franqueadas-assets/${{ inputs.destino_path }}" \
            -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" \
            -d '{"expiresIn":31536000}' | python3 -c "import json,sys;print(json.load(sys.stdin)['signedURL'])")
          URL="$SB_URL/storage/v1$SIGNED"
          # o vídeo novo substitui o vídeo anterior do post (a arte de capa fica)
          curl -sf -X DELETE "$SB_URL/rest/v1/post_midias?post_id=eq.${{ inputs.aline_post_id }}&tipo=eq.video" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" -H "Content-Profile: aline"
          curl -sf -X POST "$SB_URL/rest/v1/post_midias" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" -H "Content-Profile: aline" \
            -H "Content-Type: application/json" \
            -d "{\"post_id\":\"${{ inputs.aline_post_id }}\",\"ordem\":0,\"tipo\":\"video\",\"url\":\"$URL\",\"largura_px\":1080,\"altura_px\":1920}"
          curl -sf -X PATCH "$SB_URL/rest/v1/posts?id=eq.${{ inputs.aline_post_id }}" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" -H "Content-Profile: aline" \
            -H "Content-Type: application/json" \
            -d '{"status":"aguardando_aprovacao","midia_pendente":false}'

      - name: Devolver o post do Studio se falhar
        if: failure() && inputs.aline_post_id != ''
        run: |
          curl -s -X PATCH "$SB_URL/rest/v1/posts?id=eq.${{ inputs.aline_post_id }}&status=eq.gerando" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" -H "Content-Profile: aline" \
            -H "Content-Type: application/json" \
            -d '{"status":"aguardando_midia"}' || true

      - name: Marcar erro
        if: failure() && inputs.reel_id != ''
        run: |
          curl -s -X PATCH "$SB_URL/rest/v1/reels_animados?id=eq.${{ inputs.reel_id }}" \
            -H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"erro"}' || true
