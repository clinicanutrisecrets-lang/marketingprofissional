name: Sync Receitas

# Quando fotos são adicionadas/alteradas em receitas-fotos/, sobe pro
# Supabase Storage e atualiza a tabela biblioteca_receitas.
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE

on:
  push:
    branches: [main]
    paths:
      - "receitas-fotos/**"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python3 scripts/sync-receitas.py
