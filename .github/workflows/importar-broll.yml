# Importa clipes de b-roll de um manifesto (scripts/dados/broll-*.json) pra
# Biblioteca de clipes de uma franqueada, ou pro acervo compartilhado.
# Roda aqui, e não na sessão, porque só o repositório tem a chave de serviço
# do Supabase (mesmo secret do render-corte). Ver packages/corte-ia/importar_broll.py.
name: importar-broll

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "caminho do manifesto no repo"
        required: true
        default: "scripts/dados/broll-aline-2026-09-28.json"
      franqueada_id:
        description: "dona da biblioteca (vazio = o do manifesto)"
        required: false
        default: ""
      acervo:
        description: "true = grava no acervo compartilhado (acervo_videos)"
        required: false
        default: "false"
      dry_run:
        description: "true = só mede e tira miniatura, não sobe nada"
        required: false
        default: "false"
      # Mesmo desenho dos outros workflows: o repositório NÃO tem os secrets
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE (conferido em 28/09/2026, o job
      # saiu com SB_URL vazio). Quem dispara passa a URL e a chave por input,
      # como o app faz no render-corte. Cadastrar os dois secrets no repo
      # dispensa isso pra todos os cinco workflows.
      supabase_url:
        description: "URL do Supabase (vazio = secret SUPABASE_URL)"
        required: false
        default: ""
      supabase_key:
        description: "service role do Supabase (vazio = secret SUPABASE_SERVICE_ROLE)"
        required: false
        default: ""

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SB_URL: ${{ inputs.supabase_url != '' && inputs.supabase_url || secrets.SUPABASE_URL }}
      SB_KEY: ${{ inputs.supabase_key != '' && inputs.supabase_key || secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q requests
      - name: Conferir credencial
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::sem SB_URL/SB_KEY: cadastre os secrets SUPABASE_URL e SUPABASE_SERVICE_ROLE no repositório, ou passe os dois inputs ao disparar"
            exit 1
          fi
      - name: Importar
        run: |
          python3 packages/corte-ia/importar_broll.py \
            --manifest "${{ inputs.manifest }}" \
            --franqueada-id "${{ inputs.franqueada_id }}" \
            $([ "${{ inputs.acervo }}" = "true" ] && echo --acervo) \
            $([ "${{ inputs.dry_run }}" = "true" ] && echo --dry-run)
