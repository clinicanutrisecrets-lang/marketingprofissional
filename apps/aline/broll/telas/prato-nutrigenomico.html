<meta charset="utf-8">
<!-- O prato da saúde e da genética, na arte oficial do Consultório de
     Precisão: o prato no centro e os oito convidados da mesa em volta.
     Redesenhado em HTML pra caber na tela do monitor e poder ser editado
     sem abrir ferramenta de design. -->
<style>
  :root{
    --tinta:#1B2733; --cinza:#6B7885; --teal:#1687A7; --tealesc:#0E6E8C;
    --vermelho:#D9433F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1150px;background:#fff;padding:34px 44px 26px;
       font-family:"Liberation Sans",Arial,sans-serif;color:var(--tinta)}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:50px}
  .sobrancelha{font-size:15px;letter-spacing:2.6px;color:var(--teal);font-weight:700;
               margin-bottom:8px}
  h1{font-family:"EB Garamond",Georgia,serif;font-size:48px;line-height:1.05;
     font-weight:700;letter-spacing:-.5px}
  header p{flex:none;width:400px;font-size:18px;line-height:1.55;color:#42505E}
  header p b{color:var(--tinta)}
  .roda{display:grid;place-items:center;margin-top:6px}
</style>

<header>
  <div>
    <div class="sobrancelha">VISÃO COMPLETA</div>
    <h1>O prato da saúde e da genética</h1>
  </div>
  <p>A genética é <b>um</b> dos convidados da mesa. O resultado vem do prato
     completo, e o que você sente senta nessa mesa junto.</p>
</header>

<div class="roda">
<svg width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <style>
      .rot{font-family:Arial, sans-serif;font-size:19px;fill:#2C3A47;text-anchor:middle}
      .rot.dest{fill:var(--vermelho);font-weight:700}
      .sub{font-family:Arial, sans-serif;font-size:15px;fill:#6B7885;text-anchor:middle}
      .ic{fill:none;stroke:#1687A7;stroke-width:2.2;stroke-linecap:round;
          stroke-linejoin:round}
      .ic.vm{stroke:var(--vermelho)}
      .ic.vd{stroke:#2AA37A}
    </style>
  </defs>

  <!-- anel e raios -->
  <circle cx="500" cy="300" r="222" fill="none" stroke="#DCE7EC" stroke-width="1.4"/>
  <g stroke="#C9D6DE" stroke-width="1.3" stroke-dasharray="5 7">
    <line x1="500" y1="300" x2="500" y2="78"/>
    <line x1="500" y1="300" x2="657" y2="143"/>
    <line x1="500" y1="300" x2="722" y2="300"/>
    <line x1="500" y1="300" x2="657" y2="457"/>
    <line x1="500" y1="300" x2="500" y2="522"/>
    <line x1="500" y1="300" x2="343" y2="457"/>
    <line x1="500" y1="300" x2="278" y2="300"/>
    <line x1="500" y1="300" x2="343" y2="143"/>
  </g>

  <!-- centro -->
  <circle cx="500" cy="300" r="118" fill="#E3F1F7" stroke="#9FCDDE" stroke-width="1.6"/>
  <circle cx="500" cy="272" r="21" fill="none" stroke="var(--teal)" stroke-width="3"/>
  <circle cx="500" cy="272" r="9" fill="none" stroke="var(--teal)" stroke-width="3"/>
  <text x="500" y="325" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" font-weight="700" fill="var(--tealesc)">Seu prato</text>

  <!-- 1. hábitos alimentares, topo -->
  <circle cx="500" cy="78" r="42" fill="#FDF6DC" stroke="#EBD98F" stroke-width="1.6"/>
  <g class="ic" transform="translate(500,78)">
    <path d="M-9 -13 L-9 -1 M-4 -13 L-4 -1 M-6.5 -1 L-6.5 13"/>
    <path d="M8 -13 C11 -13 11 -4 8 -3 L8 13"/>
  </g>
  <text class="rot" x="500" y="146">Hábitos alimentares</text>

  <!-- 2. nutrigenoma -->
  <circle cx="657" cy="143" r="42" fill="#DCF0F7" stroke="#95CDE0" stroke-width="1.6"/>
  <g class="ic" transform="translate(657,143)">
    <path d="M-9 -12 C-3 -5 3 5 9 12 M9 -12 C3 -5 -3 5 -9 12"/>
    <path d="M-7 -12 L7 -12 M-7 12 L7 12"/>
  </g>
  <text class="rot" x="657" y="211">Nutrigenoma</text>

  <!-- 3. comportamento alimentar -->
  <circle cx="722" cy="300" r="42" fill="#E4E9EC" stroke="#B8C4CC" stroke-width="1.6"/>
  <g class="ic" transform="translate(722,300)" stroke="#4A6474">
    <path d="M0 -13 C8 -13 12 -7 12 0 C12 8 6 13 0 13 C-6 13 -12 8 -12 0 C-12 -7 -8 -13 0 -13"/>
    <path d="M0 -13 L0 13 M-6 -5 L6 -5 M-6 5 L6 5"/>
  </g>
  <text class="rot" x="722" y="368">Comportamento</text>
  <text class="rot" x="722" y="392">alimentar</text>

  <!-- 4. microbiota -->
  <circle cx="657" cy="457" r="42" fill="#DEF4E9" stroke="#95D7B6" stroke-width="1.6"/>
  <g class="ic vd" transform="translate(657,457)">
    <circle cx="-6" cy="-6" r="4.5"/><circle cx="6" cy="-8" r="3.2"/>
    <circle cx="7" cy="4" r="4.8"/><circle cx="-5" cy="7" r="3.6"/>
  </g>
  <text class="rot" x="657" y="525">Microbiota</text>

  <!-- 5. emoções, estresse e sono -->
  <circle cx="500" cy="522" r="42" fill="#FCE3E1" stroke="#EFA9A5" stroke-width="1.6"/>
  <g class="ic vm" transform="translate(500,522)">
    <path d="M0 12 C-14 2 -13 -9 -6 -11 C-2 -12 0 -9 0 -9 C0 -9 2 -12 6 -11 C13 -9 14 2 0 12"/>
    <path d="M-9 -1 L-4 -1 L-1 -5 L2 3 L5 -1 L9 -1"/>
  </g>
  <text class="rot dest" x="500" y="590">Emoções, estresse e sono</text>
  <text class="sub" x="500" y="614">o que você sente também dá ordem pro gene</text>

  <!-- 6. metabolismo -->
  <circle cx="343" cy="457" r="42" fill="#FDF6DC" stroke="#EBD98F" stroke-width="1.6"/>
  <g class="ic" transform="translate(343,457)">
    <path d="M0 13 C-9 8 -10 -2 -3 -7 C-3 -3 -1 -1 1 -2 C3 -4 2 -9 0 -13 C8 -9 11 -1 9 4 C7 9 4 12 0 13"/>
  </g>
  <text class="rot" x="343" y="525">Metabolismo</text>

  <!-- 7. atividade física -->
  <circle cx="278" cy="300" r="42" fill="#DCF0F7" stroke="#95CDE0" stroke-width="1.6"/>
  <g class="ic" transform="translate(278,300)">
    <path d="M-13 0 L-7 0 L-3 -10 L2 9 L6 0 L13 0"/>
  </g>
  <text class="rot" x="278" y="368">Atividade física</text>

  <!-- 8. fenotipagem detalhada -->
  <circle cx="343" cy="143" r="42" fill="#E4E9EC" stroke="#B8C4CC" stroke-width="1.6"/>
  <g class="ic" transform="translate(343,143)" stroke="#4A6474">
    <circle cx="-2" cy="-2" r="9"/>
    <path d="M5 5 L12 12"/>
  </g>
  <text class="rot" x="343" y="211">Fenotipagem</text>
  <text class="rot" x="343" y="235">detalhada</text>
</svg>
</div>
